name: Bug report
description: Report a reproducible problem without sharing private connection data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Never paste subscription URLs, UUIDs or private server details.
  - type: input
    id: version
    attributes:
      label: matveevVpn version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
