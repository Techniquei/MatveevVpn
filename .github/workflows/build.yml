name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: ./Scripts/validate.sh
      - name: Build DMG
        run: ./Scripts/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: matveevVpn-1.0.0-arm64
          path: dist/matveevVpn-1.0.0-arm64.dmg
